name: Live search smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baidu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Search Baidu via public demo
        env:
          APIHZ_PUBLIC_DEMO: '1'
        run: |
          python -m nail_media.service --tasks config/baidu-smoke.json --once
          python -m nail_media.verify_smoke runtime/history.jsonl baidu-smoke
      - name: Search Commons
        if: ${{ !cancelled() }}
        run: |
          python -m nail_media.service --tasks config/commons-smoke.json --once
          python -m nail_media.verify_smoke runtime/history.jsonl commons-smoke
