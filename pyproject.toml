[project]
name = "nail-media-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "Pillow>=10,<13", "ImageHash>=4.3,<5", "scrapy>=2.13,<3", "pydantic>=2.10,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
crawler = ["icrawler==0.6.10"]
video = ["yt-dlp>=2025.1"]
vision = ["open-clip-torch>=2.30,<4", "torch>=2.5", "numpy>=1.26"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18"]
[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["nail_media*"]

[tool.setuptools.package-data]
nail_media = ["nail_knowledge.json"]
