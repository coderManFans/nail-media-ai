[project]
name = "nail-media-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "Pillow>=10,<13", "ImageHash>=4.3,<5", "scrapy>=2.13,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["nail_media*"]
